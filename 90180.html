<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>180 Day Selector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 100%;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 24px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls label {
            font-weight: 600;
        }

        .controls input {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .controls button {
            padding: 9px 16px;
            border: 0;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .controls button:hover {
            background: #444;
        }

        .selector-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
        }

        .days {
            display: flex;
            width: max-content;
            padding: 15px;
            gap: 5px;
        }

        .day {
            width: 58px;
            min-width: 58px;
            height: 75px;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            background: #fafafa;
            transition: background 0.1s, border-color 0.1s;
        }

        .day:hover {
            border-color: #888;
            background: #eee;
        }

        .day .weekday {
            font-size: 11px;
            color: #777;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .day .date {
            font-size: 15px;
            font-weight: 600;
        }

        .day .year {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
        }

        .day.selected {
            background: #222;
            color: white;
            border-color: #222;
        }

        .day.selected .weekday,
        .day.selected .year {
            color: #ccc;
        }

        .day.today {
            outline: 2px solid #4a90e2;
            outline-offset: -2px;
        }

        .summary {
            margin-top: 20px;
            padding: 18px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .summary .count {
            font-size: 28px;
            margin-right: 5px;
        }

        .summary.over-limit {
            color: #d00000;
            border-color: #d00000;
            background: #fff5f5;
        }

        .range-info {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
            font-weight: normal;
        }

        .help {
            margin-top: 12px;
            color: #666;
            font-size: 13px;
        }

        /* ---------------------------------------
           FUTURE RANGE
        --------------------------------------- */

        .future-section {
            margin-top: 35px;
        }

        .future-section h2 {
            margin: 0 0 15px;
            font-size: 20px;
        }

        .future-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
        }

        .future-days {
            display: flex;
            width: max-content;
            padding: 15px;
            gap: 5px;
        }

        .future-day {
            width: 58px;
            min-width: 58px;
            height: 95px;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            background: #fafafa;
        }

        .future-day .weekday {
            font-size: 11px;
            color: #777;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .future-day .date {
            font-size: 15px;
            font-weight: 600;
        }

        .future-day .year {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
        }

        .future-day .available {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 700;
            color: #159447;
        }

        .future-day .available.negative {
            color: #d00000;
        }

        .future-info {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>180 Day Selector</h1>

    <div class="controls">
        <label for="endDate">Range ends on:</label>

        <input
            type="date"
            id="endDate"
        >

        <button id="setEndDate">
            Set Range
        </button>
    </div>

    <!-- CURRENT 180 DAYS -->

    <div class="selector-wrapper">
        <div id="days" class="days"></div>
    </div>

    <div id="summary" class="summary">
        <span class="count" id="selectedCount">0</span>
        selected days

        <div class="range-info" id="rangeInfo"></div>
    </div>

    <div class="help">
        Click individual dates to select them. Hold <strong>Shift</strong>
        while clicking to select a range.
    </div>


    <!-- FUTURE 180 DAYS -->

    <div class="future-section">

        <h2>Following 180 Days</h2>

        <div class="future-wrapper">
            <div id="futureDays" class="future-days"></div>
        </div>

        <div class="future-info">
            The green number shows how many days remain available under
            the 90-day limit, based on the preceding 180 days.
        </div>

    </div>

</div>


<script>
(function () {

    const RANGE_LENGTH = 180;
    const LIMIT = 90;

    const daysContainer =
        document.getElementById('days');

    const futureDaysContainer =
        document.getElementById('futureDays');

    const endDateInput =
        document.getElementById('endDate');

    const setEndDateButton =
        document.getElementById('setEndDate');

    const selectedCountElement =
        document.getElementById('selectedCount');

    const summaryElement =
        document.getElementById('summary');

    const rangeInfoElement =
        document.getElementById('rangeInfo');

    const STORAGE_KEY =
        'dateSelectorSelectedDates';

    const END_DATE_STORAGE_KEY =
        'dateSelectorEndDate';


    function pad(number) {
        return String(number).padStart(2, '0');
    }


    function dateToString(date) {
        return (
            date.getFullYear() +
            '-' +
            pad(date.getMonth() + 1) +
            '-' +
            pad(date.getDate())
        );
    }


    function stringToDate(dateString) {

        const [year, month, day] =
            dateString.split('-').map(Number);

        return new Date(
            year,
            month - 1,
            day
        );
    }


    function addDays(date, amount) {

        const result = new Date(date);

        result.setDate(
            result.getDate() + amount
        );

        return result;
    }


    function getToday() {

        const now = new Date();

        return new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );
    }


    function formatDate(date) {

        return date.toLocaleDateString(
            undefined,
            {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            }
        );
    }


    /*
     * Load selected dates.
     */

    function loadSelectedDates() {

        try {

            const stored =
                localStorage.getItem(STORAGE_KEY);

            if (!stored) {
                return new Set();
            }

            const parsed =
                JSON.parse(stored);

            if (!Array.isArray(parsed)) {
                return new Set();
            }

            return new Set(parsed);

        } catch (error) {

            console.error(
                'Could not load selected dates:',
                error
            );

            return new Set();
        }
    }


    let selectedDates =
        loadSelectedDates();

    let lastClickedDate = null;

    let currentEndDate;


    /*
     * Save selected dates.
     */

    function saveSelectedDates() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                [...selectedDates].sort()
            )
        );

        updateUrl();
    }


    /*
     * Save the current endpoint.
     */

    function saveEndDate() {

        localStorage.setItem(
            END_DATE_STORAGE_KEY,
            dateToString(currentEndDate)
        );
    }


    /*
     * Update URL.
     */

    function updateUrl() {

        const url =
            new URL(window.location.href);

        url.searchParams.set(
            'end',
            dateToString(currentEndDate)
        );

        if (selectedDates.size > 0) {

            url.searchParams.set(
                'selected',
                [...selectedDates]
                    .sort()
                    .join(',')
            );

        } else {

            url.searchParams.delete(
                'selected'
            );
        }

        window.history.replaceState(
            {},
            '',
            url.pathname +
            url.search +
            url.hash
        );
    }


    /*
     * Load state from URL/localStorage.
     */

    function loadState() {

        const url =
            new URL(window.location.href);

        const urlEnd =
            url.searchParams.get('end');

        if (
            urlEnd &&
            /^\d{4}-\d{2}-\d{2}$/.test(urlEnd)
        ) {

            currentEndDate =
                stringToDate(urlEnd);

        } else {

            const storedEnd =
                localStorage.getItem(
                    END_DATE_STORAGE_KEY
                );

            if (
                storedEnd &&
                /^\d{4}-\d{2}-\d{2}$/.test(storedEnd)
            ) {

                currentEndDate =
                    stringToDate(storedEnd);

            } else {

                currentEndDate =
                    getToday();
            }
        }


        /*
         * URL selections take priority over localStorage.
         */

        const urlSelected =
            url.searchParams.get('selected');

        if (urlSelected !== null) {

            const dates =
                urlSelected
                    .split(',')
                    .filter(function (date) {
                        return /^\d{4}-\d{2}-\d{2}$/
                            .test(date);
                    });

            selectedDates =
                new Set(dates);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    [...selectedDates].sort()
                )
            );
        }


        endDateInput.value =
            dateToString(currentEndDate);
    }


    /*
     * Render the original selectable range.
     */

    function render() {

        daysContainer.innerHTML = '';

        const startDate =
            addDays(
                currentEndDate,
                -(RANGE_LENGTH - 1)
            );


        for (
            let i = 0;
            i < RANGE_LENGTH;
            i++
        ) {

            const date =
                addDays(startDate, i);

            const dateString =
                dateToString(date);

            const dayElement =
                document.createElement('div');

            dayElement.className =
                'day';


            if (selectedDates.has(dateString)) {

                dayElement.classList.add(
                    'selected'
                );
            }


            if (
                dateString ===
                dateToString(getToday())
            ) {

                dayElement.classList.add(
                    'today'
                );
            }


            const weekday =
                document.createElement('div');

            weekday.className =
                'weekday';

            weekday.textContent =
                date.toLocaleDateString(
                    undefined,
                    { weekday: 'short' }
                );


            const dateNumber =
                document.createElement('div');

            dateNumber.className =
                'date';

            dateNumber.textContent =
                date.getDate() +
                '/' +
                (date.getMonth() + 1);


            const year =
                document.createElement('div');

            year.className =
                'year';

            year.textContent =
                date.getFullYear();


            dayElement.appendChild(
                weekday
            );

            dayElement.appendChild(
                dateNumber
            );

            dayElement.appendChild(
                year
            );


            dayElement.addEventListener(
                'click',
                function (event) {

                    /*
                     * SHIFT CLICK
                     */

                    if (
                        event.shiftKey &&
                        lastClickedDate !== null
                    ) {

                        const clickedDate =
                            stringToDate(
                                dateString
                            );

                        let rangeStart =
                            lastClickedDate <
                            clickedDate
                                ? lastClickedDate
                                : clickedDate;

                        let rangeEnd =
                            lastClickedDate <
                            clickedDate
                                ? clickedDate
                                : lastClickedDate;


                        let current =
                            new Date(rangeStart);


                        while (
                            current <= rangeEnd
                        ) {

                            selectedDates.add(
                                dateToString(
                                    current
                                )
                            );

                            current =
                                addDays(
                                    current,
                                    1
                                );
                        }

                    } else {

                        /*
                         * Normal click toggles selection.
                         */

                        if (
                            selectedDates.has(
                                dateString
                            )
                        ) {

                            selectedDates.delete(
                                dateString
                            );

                        } else {

                            selectedDates.add(
                                dateString
                            );
                        }
                    }


                    lastClickedDate =
                        stringToDate(
                            dateString
                        );

                    saveSelectedDates();

                    render();
                }
            );


            daysContainer.appendChild(
                dayElement
            );
        }


        updateSummary();

        renderFutureDays();
    }


    /*
     * Update current range summary.
     */

    function updateSummary() {

        const startDate =
            addDays(
                currentEndDate,
                -(RANGE_LENGTH - 1)
            );

        const startString =
            dateToString(startDate);

        const endString =
            dateToString(currentEndDate);


        let count = 0;


        selectedDates.forEach(
            function (dateString) {

                if (
                    dateString >= startString &&
                    dateString <= endString
                ) {

                    count++;
                }
            }
        );


        selectedCountElement.textContent =
            count;


        if (count > LIMIT) {

            summaryElement.classList.add(
                'over-limit'
            );

        } else {

            summaryElement.classList.remove(
                'over-limit'
            );
        }


        rangeInfoElement.textContent =
            formatDate(startDate) +
            ' → ' +
            formatDate(currentEndDate);
    }


    /*
     * Count selected dates in a 180-day period.
     *
     * startDate = first day included
     * endDate   = last day included
     */

    function countSelectedDays(
        startDate,
        endDate
    ) {

        const startString =
            dateToString(startDate);

        const endString =
            dateToString(endDate);

        let count = 0;


        selectedDates.forEach(
            function (dateString) {

                if (
                    dateString >= startString &&
                    dateString <= endString
                ) {

                    count++;
                }
            }
        );


        return count;
    }


    /*
     * Render the next 180 days.
     *
     * The first future day is the day AFTER
     * currentEndDate.
     */

    function renderFutureDays() {

        futureDaysContainer.innerHTML = '';


        const futureStartDate =
            addDays(
                currentEndDate,
                1
            );


        for (
            let i = 0;
            i < RANGE_LENGTH;
            i++
        ) {

            const futureDate =
                addDays(
                    futureStartDate,
                    i
                );


            /*
             * For this future date, examine the
             * 180 days immediately preceding it.
             *
             * Importantly, the future date itself
             * is NOT included.
             */

            const precedingEndDate =
                addDays(
                    futureDate,
                    -1
                );


            const precedingStartDate =
                addDays(
                    precedingEndDate,
                    -(RANGE_LENGTH - 1)
                );


            const selectedCount =
                countSelectedDays(
                    precedingStartDate,
                    precedingEndDate
                );


            const remaining =
                LIMIT - selectedCount;


            const dateElement =
                document.createElement('div');

            dateElement.className =
                'future-day';


            const weekday =
                document.createElement('div');

            weekday.className =
                'weekday';

            weekday.textContent =
                futureDate.toLocaleDateString(
                    undefined,
                    { weekday: 'short' }
                );


            const dateNumber =
                document.createElement('div');

            dateNumber.className =
                'date';

            dateNumber.textContent =
                futureDate.getDate() +
                '/' +
                (futureDate.getMonth() + 1);


            const year =
                document.createElement('div');

            year.className =
                'year';

            year.textContent =
                futureDate.getFullYear();


            const available =
                document.createElement('div');

            available.className =
                'available';


            if (remaining < 0) {

                available.classList.add(
                    'negative'
                );
            }


            available.textContent =
                remaining;


            dateElement.appendChild(
                weekday
            );

            dateElement.appendChild(
                dateNumber
            );

            dateElement.appendChild(
                year
            );

            dateElement.appendChild(
                available
            );


            futureDaysContainer.appendChild(
                dateElement
            );
        }
    }


    /*
     * Change the end date.
     */

    setEndDateButton.addEventListener(
        'click',
        function () {

            if (!endDateInput.value) {
                return;
            }


            currentEndDate =
                stringToDate(
                    endDateInput.value
                );


            saveEndDate();


            lastClickedDate =
                null;


            updateUrl();

            render();
        }
    );


    /*
     * Enter key in date field.
     */

    endDateInput.addEventListener(
        'keydown',
        function (event) {

            if (event.key === 'Enter') {

                setEndDateButton.click();
            }
        }
    );


    /*
     * Initialise.
     */

    loadState();

    render();

})();
</script>

</body>
</html>
